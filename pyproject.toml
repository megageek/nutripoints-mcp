[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nutripoints-mcp"
version = "0.1.2"
description = "MCP server exposing the Nutri Points API as tools and resources for LLM assistants"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.2.0,<5.0",
    "httpx>=0.27,<0.29",
    "jsonschema>=4.26,<5",
]

[project.optional-dependencies]
dev = [
    "anyio>=4.0,<5.0",
    "pytest>=8.3,<10.0",
    "pytest-xdist>=3.6,<4.0",
    "ruff>=0.14,<1.0",
]

[project.scripts]
nutripoints-mcp = "nutripoints_mcp.server:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nutripoints_mcp = ["contracts/*.json"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"
