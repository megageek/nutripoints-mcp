[project]
name = "nutripoints-mcp"
version = "0.1.0"
description = "MCP server exposing the Nutri Points API as tools and resources for LLM assistants"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0,<3.0",
    "httpx>=0.27,<0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10.0",
    "pytest-xdist>=3.6,<4.0",
    "ruff>=0.14,<1.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"
