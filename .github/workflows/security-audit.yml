name: Security Dependency Audit

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-dependencies:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit

      - name: Build runtime dependency manifest
        run: |
          python - <<'PY' > runtime-deps.txt
          import pathlib
          import tomllib

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          for dependency in project.get("project", {}).get("dependencies", []):
              print(dependency)
          PY

      - name: Audit Python runtime dependencies
        run: python -m pip_audit -r runtime-deps.txt

# No npm dependency-audit job: package.json here is dev-only Commitlint tooling,
# nothing from it ships in the Docker image. Dependabot still tracks it for updates.
